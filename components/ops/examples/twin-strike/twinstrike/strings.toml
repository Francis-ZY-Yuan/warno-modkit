# Twin Strike's string table (modkit.ops.strings.load; twinstrike.op packs it): every text the op shows, per token,
# in English (US) and Simplified Chinese (SC); the other six languages get the English. One section per token,
# [<dictionary>.<token>], one key per language (US required; any other language optional, packed as the US text
# where it has none). The order is the order the build writes each .dic's texts in. The dictionaries are the three
# the profile packs (twinstrike.profile.DICTIONARIES). A dialog takes no variables, so no dialog text holds %1..%9;
# hints and objectives may.
#
# The menu texts (SCENARIO_DEFINITION, profile.MENU_RENAMES) take the form of the stock Operations' own, and in each
# language stock's length range for their element (test_twin_strike_frame.Strings): the briefing (ts_order) is the
# date and time, the order number, a paragraph to the commander and four numbered points; the forces line (ts_headr)
# is the chain of command on two lines; the text under the title (ts_recap) is three past-tense paragraphs; the
# outcomes (ts_vic, ts_def) are one paragraph each. No markup. Only the two titles (profile.TITLE_TOKENS) are held
# to 30 UTF-16 units.
#
# The Chinese follows the warno-localization skill, with terms.toml as the op's term table. A native reader reviewed
# it; no Chinese play has shown it yet. Each dialog's text names its two buttons (twinstrike.strings.BUTTONS, stock
# in-game tokens) by their labels in its language.

# the menu (profile.MENU_RENAMES), in stock's form (this file's header)

