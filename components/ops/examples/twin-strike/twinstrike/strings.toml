# TextePresentationScenario, the briefing: the story (design 1), the phases (4) and the forces (6.1, 6.3)
[SCENARIO_DEFINITION.ts_order]
US = """
July 4, 1989, 04:30 UTC
Combat Order No. 79/014

Comrade commander, two weeks into the war, the division's advance hangs on a road-junction village at the \
western edge of the twin towns. It opens the road west.

1. Seize the village from the north. The division's guns can fire a preparation on it: keep your assault out \
while they fire.

2. Once the village falls, the division's reserve is yours. Hold it against NATO's two blows: a US armoured \
battalion up both roads from the south, then a West German Panzer battalion assembling south of the village. \
Front offers release for one tactical nuclear strike on that assembly area. The decision is yours.

3. Intel indicates hostile forces include:
- A West German Panzergrenadier company in the village, with Marders, Leopard 1A5s and Milan teams.
- A US armoured task force of M1A1HA Abrams and M2A2 Bradleys, with recon and heavy air defence.
- A West German Panzer battalion of Leopard 2A4s and Marders.
- NATO fighter sweeps.

4. Under your command, the forward detachment of the 79th Guards Tank Division:
- T-80BV tanks, motor rifles in BMP-2s, Konkurs-M teams in BTR-80s, engineers, scouts, Shilkas, 2S1s and Ka-29s.
- The division's 2S7M and BM-27 batteries, on call.
- In reserve: T-80U tanks, Konkurs-M and Metis teams, Ka-50 and Mi-24V helicopters, Tunguska, Osa and Kub air \
defence."""
SC = """
1989年7月4日 04:30 UTC
战斗命令第79/014号

指挥员同志，开战两周，全师推进系于双城西缘的道路枢纽村庄。夺取该村即可打通西进道路。

1. 从北面夺取该村。师炮兵可实施冲击炮火准备，届时冲击分队须在村外。

2. 夺取该村后，师预备队归您指挥。扼守该村，抗击北约两次突击：美军坦克营由南沿两路北上，\
西德坦克营随后在村南集结。方面军可批准对该集结地域实施一次战术核突击，由您决定。

3. 敌情：
- 村内：西德装甲掷弹兵连，有黄鼠狼步兵战车、豹1A5坦克和米兰反坦克小组。
- 美军坦克营特遣队：M1A1HA坦克和M2A2步兵战车，另有侦察分队和强大的防空火力。
- 西德坦克营：豹2A4坦克和黄鼠狼步兵战车。
- 北约战斗机扫荡。

4. 您指挥的近卫坦克第79师先遣支队：
- T-80BV坦克、乘BMP-2步兵战车的摩步、乘BTR-80的竞赛-M反坦克小组、工兵、侦察兵、石勒喀自行高炮、\
2S1自行榴弹炮和Ka-29直升机。
- 师炮兵2S7M炮兵连和BM-27火箭炮连随时待命。
- 预备队：T-80U坦克，竞赛-M和混血儿反坦克小组，Ka-50和Mi-24V直升机，通古斯卡、黄蜂和立方防空系统。"""

# TexteObjectifs, under the title: the background (design 1), ending on the detachment's orders
[SCENARIO_DEFINITION.ts_recap]
US = """
Two weeks into the war, the Soviet advance was still rolling west. The next bound of the 79th Guards Tank \
Division hung on one road junction: a small village on the western edge of a pair of towns, whose road led \
west. The division sent its forward detachment to seize it.

NATO could not let the road go. A US armoured battalion was ordered to counter-attack at once, up both roads \
from the south, behind a recon screen and under heavy air defence. A West German Panzer battalion was to \
assemble south of the village for a second, heavier blow.

Soviet doctrine of the time planned nuclear strikes against exactly this: an enemy reserve concentrating to \
counter-attack. Front command stood ready to release one tactical nuclear strike on the assembly area. The \
forward detachment was to take the village, hold it against both blows, and decide whether to ask for the strike."""
SC = """
开战两周后，苏军仍在向西推进。近卫坦克第79师的下一步推进取决于一个道路枢纽：双城西缘的一个小村庄，\
村中道路通向西方。该师派出先遣支队前去夺取。

北约不能放弃这条道路。美军一个坦克营奉命立即从南面沿两条道路实施反冲击，以侦察分队担任警戒，\
并有强大的防空火力掩护。西德一个坦克营则将在村南集结，准备实施第二次、更猛烈的突击。

按照当时的苏军条令，核突击针对的正是这种目标：集结准备反冲击的敌预备队。\
方面军已准备批准对该集结地域实施一次战术核突击。先遣支队的任务是夺取该村，扼守该村抗击两次突击，\
并决定是否请求核突击。"""

