# Twin Strike's term table (warno-localization, step 2), in the string table's shape (modkit.ops.strings.load):
# one section per term, [<group>."<English term>"], one key per language (US the English term) and, for each other
# language, source.<language>: where its text comes from. "stock <DICTIONARY>" is the game's own text
# (python -m modkit.core.glossary term / token), "doctrine" PRC military terminology on the Soviet Army (the Russian
# original beside it), "term sheet" the maintainer's review, "ours" this op's own wording. The groups are only
# headings. strings.toml's Chinese uses every term (test_twin_strike_chinese).

