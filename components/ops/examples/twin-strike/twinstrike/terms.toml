# Twin Strike's term table (warno-localization, step 2): English term -> its text and source in each language the op
# is in, one section per term and language, ["<English term>".<language>], with `text` and `source`. "stock
# <DICTIONARY>" is the game's own text (python -m modkit.core.glossary term / token), "doctrine" PRC military
# terminology on the Soviet Army (the Russian original beside it), "term sheet" the maintainer's review, "ours" this
# op's own wording. strings.toml's Chinese uses every term (test_twin_strike_chinese).

