# Twin Strike's Workshop change notes, one table per upload, newest first (modkit.core.workshop: item.toml's
# `changes`). WARNO's upload writes every note as "Game Version = <build> / Mod Version = 0". Before an upload, write
# its note as [next]; after it, paste the note over the default on the item's Change Notes page
# (python -m modkit.core.workshop note item.toml prints it), then rename [next] to the note's id, which
# `workshop check` names (the update's Unix time). Steam BBCode works in a note; keep a note short, for players.
# Each note_zh is its release's note in Simplified Chinese: the description's Changelog shows the newest uploaded
# notes ({{changes}}, as many as item.toml's changes_shown), its 更新日志 their note_zh ({{changes_zh}}), so render
# and paste the description again after the rename. The Chinese notes are not yet reviewed by a native reader.

[next]
note = "Fixed for WARNO build 212400: the game's 18 Nov update had stopped the Operation loading (an NDF parsing error at launch)."
note_zh = "为WARNO 212400版本修复：游戏11月18日的更新导致本行动无法载入（启动时出现NDF解析错误）。"

