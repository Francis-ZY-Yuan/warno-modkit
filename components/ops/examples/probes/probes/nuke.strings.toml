# Probe 3's string table for nuke (probes.nuke, the NUKE variant; modkit.ops.strings.load). nuke_sov's is
# nuke_sov.strings.toml. One section per token, [<dictionary>.<token>], one key per language (US required; any other
# language optional, packed as the US text where it has none). The order is the order the build writes each .dic's
# texts in.

# menu tokens, each text at most 30 UTF-16 units
[SCENARIO_DEFINITION.nk_name]
US = "Nuke probe"
SC = "打击特效测试"

[SCENARIO_DEFINITION.nk_cname]
US = "NUKE PROBE"
SC = "打击特效测试"

[SCENARIO_DEFINITION.nk_headr]
