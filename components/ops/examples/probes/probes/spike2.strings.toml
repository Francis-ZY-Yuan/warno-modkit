# 1:00 capture
["Scripting/Localization".od_hcap]
US = """
CAPTURE: Soviet command tank A drives from ENTRY E to seize CAP A (Village E); the script removes it once CAP A \
is Soviet. Command tank B heads for CAP B (Town SE) and is destroyed by script 3 s after it enters. Keep your \
units out of both."""
SC = """
占领：苏军指挥坦克A从ENTRY E出发，夺取CAP A（Village E）；CAP A归苏军所有后，脚本将其移除。指挥坦克B前往CAP \
B（Town SE），进入3秒后被脚本摧毁。请让您的单位远离这两处。"""

["Scripting/Localization".od_hnato]
US = """
CAPTURE: your M1A1 CMD tank is on the road 1 km west of CAP A. Drive it into CAP A and watch CAP A's owner. \
Once it reads 1, or at 7:45 at the latest, pull the tank 1.5 km south-west, clear of CAP B."""
SC = """
占领：您的M1A1指挥坦克位于CAP A以西1公里的道路上。将其开进CAP A，并观察CAP A的归属。归属显示1后（最迟7:45），\
请将坦克向西南撤出1.5公里，远离CAP B。"""

["Scripting/Localization".od_hkillb]
US = "CAPTURE: tank B entered CAP B and was destroyed by script after 3 s. Watch CAP B's colour on the map."
SC = "占领：坦克B进入CAP B，3秒后被脚本摧毁。请在地图上观察CAP B的归属。"

