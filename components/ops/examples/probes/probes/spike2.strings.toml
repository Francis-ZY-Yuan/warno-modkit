# Probe 2's string table (probes.spike2; modkit.ops.strings.load). One section per token, [<dictionary>.<token>],
# one key per language (US required; any other language optional, packed as the US text where it has none). The
# order is the order the build writes each .dic's texts in.

# menu tokens (MENU_RENAMES), each text at most 30 UTF-16 units
[SCENARIO_DEFINITION.o2_name]
US = "Open Door test 2"
SC = "开门行动：测试2"

[SCENARIO_DEFINITION.o2_cname]
US = "OPEN DOOR TEST 2"
SC = "开门行动：测试2"

[SCENARIO_DEFINITION.o2_headr]
US = "Open Door test 2 checklist"
SC = "开门行动测试2清单"

[SCENARIO_DEFINITION.o2_order]
US = "Three short runs."
SC = "三局短测试。"

[SCENARIO_DEFINITION.o2_recap]
US = "Capture, objectives, endings"
SC = "占领、目标与结局"

[SCENARIO_DEFINITION.o2_vic]
US = "Test 2 complete."
SC = "测试2完成。"

[SCENARIO_DEFINITION.o2_def]
US = "Test 2 ended."
SC = "测试2结束。"

# the buttons' own labels are stock INGAME tokens (BUTTON_*), not ours
["Scripting/Dialog".od_start]
US = """
#bold{OPEN DOOR TEST 2: pick the run.}
ALL: the full test. At 15:00 a dialog offers VICTORY! or DEFEAT!, and the battle should end that way.
FAST: the ending race. 30 s after your click, two endings fire at once, in the opposite order on Hard. Note the \
end screen."""
SC = """
#bold{开门行动测试2：选择测试方式。}
全部：完整测试。15:00时对话窗口会让您选择胜利！或败北！，战斗应随之结束。
快：结局先后测试。点击30秒后两个结局同时触发，困难难度下顺序相反。请记下结算界面。"""

["Scripting/Dialog".od_springq]
US = """
#bold{SPRING TEST: spring the trap now?}
FIRE AT WILL: now. The test stops asking.
HOLD FIRE: wait. It asks again in 30 s, up to 4 times in all."""
SC = """
#bold{发动测试：现在发动伏击？}
自由射击：现在发动，测试不再提问。
不射击：等待，30秒后再次提问，最多共4次。"""

["Scripting/Dialog".od_endq]
US = """
#bold{FULL TEST: the ending.}
VICTORY!: the battle should end in a total victory. DEFEAT!: in a defeat. Note the end screen."""
SC = """
#bold{完整测试：结局。}
胜利！：战斗应以完全胜利结束。败北！：战斗应以失败结束。请记下结算界面。"""

