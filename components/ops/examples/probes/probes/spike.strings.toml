# The spike's string table, spike_safe's too (probes.spike; modkit.ops.strings.load). One section per token,
# [<dictionary>.<token>], one key per language (US required; any other language optional, packed as the US text
# where it has none). The order is the order the build writes each .dic's texts in.

# menu tokens, each text at most 30 UTF-16 units
[SCENARIO_DEFINITION.od_name]
US = "Open Door: spike"
SC = "开门行动：机制测试"

[SCENARIO_DEFINITION.od_cname]
US = "OPEN DOOR: SPIKE"
SC = "开门行动：机制测试"

[SCENARIO_DEFINITION.od_headr]
