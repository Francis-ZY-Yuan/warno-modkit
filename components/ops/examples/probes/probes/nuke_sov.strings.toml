# Probe 3's string table for nuke_sov (probes.nuke, the SOV variant; modkit.ops.strings.load). nuke's is
# nuke.strings.toml. One section per token, [<dictionary>.<token>], one key per language (US required; any other
# language optional, packed as the US text where it has none). The order is the order the build writes each .dic's
# texts in.

